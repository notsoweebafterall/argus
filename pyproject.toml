[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-ml"
version = "0.1.0"
description = "Multi-agent system for autonomous end-to-end ML engineering on the Bank Account Fraud (BAF) dataset"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Argus ML Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.10.0",
    "mcp>=1.0.0",
    "xgboost>=2.0.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "groq>=0.9.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
]

[tool.setuptools]
packages = [
    "agents",
    "pipeline",
    "tools",
    "mcp_servers",
    "serving",
    "monitoring",
    "eval",
    "eval.agent_eval",
    "eval.model_eval",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "eval"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
